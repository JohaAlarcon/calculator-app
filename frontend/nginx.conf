# Serves the built app and proxies /api to the calculator service (ADR-0005).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the service through Docker's embedded DNS (127.0.0.11) on each request,
    # not once at startup, so nginx starts and serves the UI even while the backend
    # is down. This config is only used inside the Docker Compose network.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        # Fail fast when the service is down, so the UI shows "unavailable" quickly.
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
