services:
  backend:
    build: ./backend
    environment:
      PORT: "8080"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000}"
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${UI_PORT:-3000}:80"
    restart: unless-stopped
